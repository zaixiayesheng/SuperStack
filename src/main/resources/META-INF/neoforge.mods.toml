modLoader = "javafml"
loaderVersion = "[3,)"
license = "MIT"

[[mods]]
modId = "superstack"
version = "${version}"
displayName = "超级堆叠"
authors = "zaixiayesheng"
logoFile = "superstack_logo.png"
description = '''
把物品的堆叠上限提高到可配置的值（默认 32768）。

背包、箱子、合成格这些地方都能放满一整叠；数量显示用精确数字，不会缩写成 1K。
'''

[[mixins]]
config = "superstack.mixins.json"

[[dependencies.superstack]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.superstack]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "superstack.compat.mixins.json"
