modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "superstack"
version = "${version}"
displayName = "超级堆叠"
authors = "zaixiayesheng"
description = '''
把物品的堆叠上限提高到可配置的值（默认 32768）。

背包、箱子、合成格这些地方都能放满一整叠；数量显示用精确数字，不会缩写成 1K。
'''

[[dependencies.superstack]]
    modId = "forge"
    mandatory = true
    versionRange = "[${forge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.superstack]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[${minecraft_version},1.21)"
    ordering = "NONE"
    side = "BOTH"
